<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almoxarifado de Enfermagem - SENAC</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="container">
            <h1>Controle de Almoxarifado</h1>
            <p>Técnico em Enfermagem - SENAC Zona Norte</p>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <h2>Cadastrar Novo Material</h2>
            <form id="form-cadastro" onsubmit="return false;">
                <div class="form-group">
                    <label for="input-nome">Nome do Material:</label>
                    <input type="text" id="input-nome" placeholder="Ex: Seringa 10ml, Luva de Procedimento" required>
                </div>

                <div class="form-group">
                    <label for="input-quantidade">Quantidade Inicial:</label>
                    <input type="number" id="input-quantidade" min="0" placeholder="Ex: 50" required>
                </div>

                <button type="button" id="btn-cadastrar">Cadastrar Material</button>
            </form>
        </section>

        <section class="card">
            <div
                style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 20px;">
                <div style="flex: 1; min-width: 250px;">
                    <label for="input-busca" style="display: block; margin-bottom: 5px; font-weight: 600;">Pesquisar
                        Material:</label>
                    <input type="text" id="input-busca" placeholder="Digite o nome do material para filtrar..."
                        style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px;">
                </div>
                <div
                    style="background-color: var(--primary-color); color: white; padding: 10px 20px; border-radius: 4px; font-weight: bold; text-align: center;">
                    Total de Itens Cadastrados: <span id="total-itens">0</span>
                </div>
            </div>
            <h2>Materiais em Estoque</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome do Material</th>
                            <th>Quantidade</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-materiais">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="main.js"></script>
</body>

</html>
